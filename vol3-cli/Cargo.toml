[package]
name = "vol3-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for Volatility3 Rust"
license = "Apache-2.0"

[[bin]]
name = "vol3"
path = "src/main.rs"

[dependencies]
vol3-core = { path = "../vol3-core" }
vol3-layers = { path = "../vol3-layers" }
vol3-symbols = { path = "../vol3-symbols" }
vol3-objects = { path = "../vol3-objects" }
vol3-framework = { path = "../vol3-framework" }
vol3-renderers = { path = "../vol3-renderers" }
vol3-plugins-linux = { path = "../vol3-plugins-linux" }
vol3-plugins-windows = { path = "../vol3-plugins-windows" }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
env_logger = "0.11"
log = "0.4"
serde_json = "1.0"
regex = "1.10"
byteorder = "1.5"
