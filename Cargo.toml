[workspace]
resolver = "2"
members = [
    "vol3-core",
    "vol3-layers",
    "vol3-symbols",
    "vol3-objects",
    "vol3-framework",
    "vol3-renderers",
    "vol3-cli",
    "vol3-plugins-linux",
    "vol3-plugins-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Volatility Foundation"]
license = "VSL-1.0"
repository = "https://github.com/volatilityfoundation/volatility3"

[workspace.dependencies]
# Core dependencies
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary parsing
byteorder = "1.5"
zerocopy = { version = "0.8", features = ["derive"] }
nom = "7"

# Memory mapping and I/O
memmap2 = "0.9"
memchr = "2.7"
flate2 = "1.0"
xz2 = "0.1"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2.5"

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
regex = "1"
lazy_static = "1.5"
once_cell = "1.20"
hashbrown = "0.15"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
rayon = "1.10"
uuid = { version = "1", features = ["serde", "v4"] }

# Testing
tempfile = "3"
