[package]
name = "vol3-plugins-linux"
version = "0.1.0"
edition = "2021"
description = "Linux plugins for Volatility3 Rust"
license = "Apache-2.0"

[dependencies]
vol3-core = { path = "../vol3-core" }
vol3-layers = { path = "../vol3-layers" }
vol3-symbols = { path = "../vol3-symbols" }
vol3-objects = { path = "../vol3-objects" }
vol3-framework = { path = "../vol3-framework" }
thiserror = "2.0"
log = "0.4"
byteorder = "1.5"
chrono = "0.4"
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
tar = "0.4"
tempfile = "3.10"
